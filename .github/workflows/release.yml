name: Release binaries

# Builds paygate for macOS, Linux and Windows when a GitHub release is
# published and attaches the archives and their checksums to it. Run it by
# hand with a tag to build them again for an existing release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release, e.g. v0.9.0
        required: true

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check that the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match VERSION $version"
            exit 1
          fi

      - name: Build the archives
        run: ./scripts/dist.sh "${TAG#v}"

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
